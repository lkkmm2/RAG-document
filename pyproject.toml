[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "2.0.0"
description = "DocQA - 可评测、可观测的 RAG 文档问答系统（混合检索 + 重排 + Agent）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lu Song" }]
keywords = ["rag", "llm", "retrieval", "agent", "fastapi", "streamlit"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "openai>=1.40",
    "chromadb>=0.5.5",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]
# 国内下载 BAAI/bge-* 权重走 ModelScope 更稳；装了它 embedding 会自动优先走魔搭
cn = ["modelscope>=1.16"]

[project.scripts]
docqa-ingest = "docqa.cli:main_ingest"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入写法就是在参数默认值里调用 File()/Depends()，B008 在这里是误报
"src/docqa/api/routes.py" = ["B008"]
